name: Build Android app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Bundle the app page into the APK
        run: |
          mkdir -p android/app/src/main/assets
          cp -r index.html data android/app/src/main/assets/
      - name: Build
        working-directory: android
        run: gradle assembleRelease --no-daemon
      - name: Publish the APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk scripture-vault.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest scripture-vault.apk --title "Scripture Vault (latest)" --notes "Install scripture-vault.apk on your Android phone."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build Android app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Bundle the app page into the APK
        run: |
          mkdir -p android/app/src/main/assets
          cp -r index.html data android/app/src/main/assets/
          sed -i "s/APP_VERSION = '[^']*'/APP_VERSION = '1.0.${{ github.run_number }}'/" android/app/src/main/assets/index.html
      - name: Build
        working-directory: android
        run: gradle assembleRelease --no-daemon
      - name: Publish the APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk scripture-vault.apk
          cp scripture-vault.apk scripture-vault-1.0.${{ github.run_number }}.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest scripture-vault.apk scripture-vault-1.0.${{ github.run_number }}.apk --title "Scripture Vault 1.0.${{ github.run_number }}" --notes "Install the APK on your Android phone. Version 1.0.${{ github.run_number }}."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

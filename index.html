<style>
/* Layout: one column, phone-first. Reader is home; bottom tabs switch Read / Notes / Vault / Search; a page editor with a thumb toolbar. */
:root {
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);

  --accent: #c9952b; --accent-ink: #1d1708; --chrome: #1d2238; --chrome-ink: #f4f5f9;
  --person: #b4532a; --place: #1f7a5a; --theme: #3557c4; --idea: #8a3fb8;
  --serif: "Noto Serif", Georgia, "Times New Roman", serif;
  --sans: system-ui, Roboto, -apple-system, "Segoe UI", sans-serif;
  --label: "Roboto Condensed", "sans-serif-condensed", "Arial Narrow", system-ui, sans-serif;
  --mix: 20%; --rs: 19px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12141d; --surface: #1b1e2b; --ink: #e8eaf3; --muted: #9aa0bb; --line: #2c3044;
  --accent: #e0b04a; --accent-ink: #1d1708; --chrome: #0c0e15; --chrome-ink: #e8eaf3;
  --person: #ff9466; --place: #55d1a2; --theme: #8fa8ff; --idea: #d29bff; --mix: 26%; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #12141d; --surface: #1b1e2b; --ink: #e8eaf3; --muted: #9aa0bb; --line: #2c3044;
  --accent: #e0b04a; --accent-ink: #1d1708; --chrome: #0c0e15; --chrome-ink: #e8eaf3;
  --person: #ff9466; --place: #55d1a2; --theme: #8fa8ff; --idea: #d29bff; --mix: 26%; color-scheme: dark }

html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 17px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--chrome); }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.t-person { --c: var(--person); } .t-place { --c: var(--place); } .t-theme { --c: var(--theme); } .t-idea { --c: var(--idea); }

header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--chrome); color: var(--chrome-ink);
  padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(10px, env(safe-area-inset-right, 0px)); padding-block: 8px;
  display: flex; align-items: center; gap: 8px; min-height: 56px; }
header .iconbtn { border: 0; background: rgba(255,255,255,.1); color: var(--chrome-ink); border-radius: 10px; min-width: 44px; height: 44px; font-size: 20px; padding: 0 10px; }
.brand { flex: 1; font-family: var(--serif); font-size: 21px; font-weight: 700; letter-spacing: .01em; }

.vs sup { font-family: var(--label); font-weight: 700; font-size: .62em; color: var(--accent); margin-right: 4px; vertical-align: .45em; }

.chapnav { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.row .scr { font-family: var(--serif); color: var(--ink); font-size: 16px; overflow-wrap: anywhere; }

.meta { font-family: var(--label); font-weight: 600; font-size: 14px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; }
.ref { color: var(--accent-ink); background: color-mix(in srgb, var(--accent) 75%, transparent); border-radius: 4px; padding: 0 6px; }
.ex { color: var(--chrome-ink); background: var(--chrome); border-radius: 4px; padding: 0 6px; }
.empty, .hint { color: var(--muted); }

.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
.seg button { border: 0; background: transparent; border-radius: 9px; padding: 10px; font-family: var(--label); font-weight: 700; font-size: 17px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.seg button.on { background: var(--ink); color: var(--bg); }
h2.lbl, .lbl { font-family: var(--label); font-weight: 700; font-size: 14px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0; }

/* Page editor */
.types { display: flex; gap: 6px; flex-wrap: wrap; }
.field { display: grid; gap: 4px; }
.fld { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px; font-size: 16px; width: 100%; box-sizing: border-box; }

.ed { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }

  white-space: pre-wrap; overflow-wrap: break-word; word-break: normal; letter-spacing: normal; tab-size: 4; }
.ed .bd { position: absolute; inset: 0; color: transparent; pointer-events: none; overflow: hidden; }
.ed textarea { position: relative; display: block; background: transparent; resize: none; overflow: hidden; min-height: 40vh; caret-color: var(--ink); }

mark { color: transparent; border-radius: 3px; background: color-mix(in srgb, var(--c) var(--mix), transparent); box-shadow: inset 0 -2px 0 var(--c); }

.findbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px; font-weight: 700; }

/* Bottom bars */
.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line);
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
  padding-top: 6px; padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 6px; }
#tabs { grid-template-columns: repeat(4, 1fr); }

#tools { grid-template-columns: 56px 1fr 56px 56px; gap: 8px; padding-top: 8px; padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px)); }
#tools button { height: 56px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); font-size: 22px; }
#tools #linkBtn { background: var(--accent); color: var(--accent-ink); border: 0; font-weight: 700; font-size: 19px; }
#pill { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 7;
  border: 0; border-radius: 999px; padding: 12px 18px; font-weight: 700; font-size: 17px; background: var(--ink); color: var(--bg);

#sheet .card { background: var(--surface); width: 100%; border-radius: 18px 18px 0 0; max-height: 88%; overflow: auto; box-sizing: border-box;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));

#sheet .vtext { font-family: var(--serif); color: var(--ink); font-size: 18px; line-height: 1.6; }
.sbtn { border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 14px; font-weight: 700; text-align: left; }
.sbtn.primary { background: var(--accent); color: var(--accent-ink); border: 0; }
.sbtn.danger { color: var(--person); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; }
.grid.n { grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); }
.grid button { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 10px 4px; font-size: 15px; font-weight: 700; }
.grid button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.words { display: flex; flex-wrap: wrap; gap: 6px; }
.words button { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 8px 10px; font-family: var(--serif); font-size: 17px; }
.words button.sel { background: color-mix(in srgb, var(--accent) 45%, transparent); border-color: var(--accent); }
#sheet textarea { width: 100%; box-sizing: border-box; min-height: 140px; border: 1px solid var(--line); border-radius: 10px; padding: 10px; font-size: 14px; background: var(--bg); }
#toast { position: fixed; left: 50%; transform: translateX(-50%); top: calc(70px + env(safe-area-inset-top, 0px)); z-index: 30;
  background: var(--ink); color: var(--bg); border-radius: 10px; padding: 10px 16px; font-weight: 700; max-width: calc(100% - 32px); }
@media (prefers-reduced-motion: no-preference) { #pill, #toast { animation: up .18s ease-out; } @keyframes up { from { opacity: 0; translate: 0 8px; } } }
</style>

        '<p class="hint">Put the cursor on a word (or select a few words), then tap 🔗 Link word or press Tab. 📖 adds the verse you were reading.</p>') + '</div>';
    if (!isV && d.ref) {
      loadBook(S.ver, d.ref.b).then(function (bk) { var ch = bk.c[d.ref.c - 1] || [], a = d.ref.v || 1, z = d.ref.v2 || a; $('qText') && ($('qText').textContent = ch.slice(a - 1, z).join(' ')); }).catch(function () {});
      $('qGo').onclick = function () { go({ view: 'read', b: d.ref.b, c: d.ref.c, v: d.ref.v }); };
    }
    if (isV) {
      var tb = $('types');
      Object.keys(TYPES).forEach(function (k) {
        var x = document.createElement('button'); x.className = 'chip t-' + k + (d.type === k ? ' on' : ''); x.innerHTML = '<span class="dot"></span>' + TYPES[k];
        x.onclick = function () { d.type = k; save(); [].forEach.call(tb.children, function (y) { y.classList.toggle('on', y === x); }); }; tb.appendChild(x);
      });
      $('aliases').onchange = function () { d.aliases = this.value.split(',').map(function (s) { return s.trim(); }).filter(Boolean); d.updated = Date.now(); buildMap(); paint(); save(); };
      renderMentions();
      $('findBible').onclick = function () {
        var terms = [d.title].concat(d.aliases).filter(function (x) { return x && x.trim().length > 1; }).sort(function (a, b) { return b.length - a.length; });
        var re = new RegExp('(?<![\\p{L}\\p{N}])(' + terms.map(escRe).join('|') + ')(?![\\p{L}\\p{N}])', 'giu');
        bibleSearch(re, $('bibleHits'), 150);
      };
    }
    var ta = $('ta');
    ta.addEventListener('input', function () { d.text = ta.value; d.updated = Date.now(); paint(); save(); $('pill').hidden = true; });
    ta.addEventListener('click', function () { setTimeout(checkPill, 0); });
    ta.addEventListener('keyup', function (e) { if (/Arrow|Home|End/.test(e.key)) checkPill(); });
    ta.addEventListener('keydown', function (e) { if (e.key === 'Tab') { e.preventDefault(); linkWord(); } });
    window.scrollTo(0, 0); paint();
    if (opt.pos != null) {
      try { ta.setSelectionRange(opt.pos, opt.pos); } catch (e) {}
      var mk = document.querySelector('mark[data-s="' + opt.pos + '"]');
      if (mk) { mk.classList.add('hit'); mk.scrollIntoView({ block: 'center' }); setTimeout(function () { mk.classList.remove('hit'); }, 1600); }
    }
  }
  function paint() {
    var ta = $('ta'), bd = $('bd'); if (!ta) return;
    var text = ta.value, h = '', i = 0;
    ranges = allRanges(text, cur.kind === 'vault' ? cur.id : null);
    ranges.forEach(function (r) {
      var cls = r.r ? 'r' : 't-' + vault(r.id).type;
      h += esc(text.slice(i, r.s)) + '<mark class="' + cls + '" data-s="' + r.s + '">' + esc(text.slice(r.s, r.e)) + '</mark>'; i = r.e;
    });
    h += esc(text.slice(i)); if (text.slice(-1) === '\n' || !text) h += ' ';
    bd.innerHTML = h; ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px';
  }
  function renderMentions() {
    var box = $('mentions'); if (!box) return; box.innerHTML = ''; var found = 0;
    S.notes.map(function (n) { return { kind: 'note', d: n }; }).concat(S.vault.filter(function (v) { return v.id !== cur.id; }).map(function (v) { return { kind: 'vault', d: v }; }))
      .forEach(function (x) {
        findLinks(x.d.text, x.kind === 'vault' ? x.d.id : null).filter(function (r) { return r.id === cur.id; }).forEach(function (r) {
          found++; var t = x.d.text, a = Math.max(0, r.s - 50), z = Math.min(t.length, r.e + 50);
          var b = document.createElement('button'); b.className = 'mention';
          b.innerHTML = '<span class="meta">' + (x.kind === 'note' ? 'Note' : TYPES[x.d.type]) + ' · ' + esc(x.kind === 'note' ? noteTitle(x.d) : x.d.title) + '</span>' +
            '<span>' + (a ? '…' : '') + esc(t.slice(a, r.s)) + '<em>' + esc(t.slice(r.s, r.e)) + '</em>' + esc(t.slice(r.e, z)) + (z < t.length ? '…' : '') + '</span>';
          b.onclick = function () { go({ view: 'doc', kind: x.kind, id: x.d.id, pos: r.s }); }; box.appendChild(b);
        });
      });
    if (!found) box.innerHTML = '<p class="hint">Not in your notes yet. Once you write or say this name in a note, it shows up here.</p>';
  }
  function checkPill() {
    var ta = $('ta'), p = $('pill'); if (!ta) return;
    if (ta.selectionStart !== ta.selectionEnd) { p.hidden = true; return; }
    var pos = ta.selectionStart, r = null;
    for (var i = 0; i < ranges.length; i++) if (pos >= ranges[i].s && pos <= ranges[i].e) { r = ranges[i]; break; }
    if (!r) { p.hidden = true; return; }
    if (r.r) {
      p.className = ''; p.innerHTML = '<span>📖 Go to ' + esc(refStr(r.r)) + ' ›</span>'; p.hidden = false;
      p.onclick = function () { p.hidden = true; go({ view: 'read', b: r.r.b, c: r.r.c, v: r.r.v }); };
    } else {
      var v = vault(r.id); p.className = 't-' + v.type; p.innerHTML = '<span class="dot"></span><span>Open ' + esc(v.title) + ' ›</span>'; p.hidden = false;
      p.onclick = function () { p.hidden = true; go({ view: 'doc', kind: 'vault', id: v.id }); };
    }
  }
  var WORD = /[\p{L}\p{N}'’\-]/u;
  function linkWord() {
    var ta = $('ta'); if (!ta) return; var s = ta.selectionStart, e = ta.selectionEnd, t = ta.value;
    for (var i = 0; i < ranges.length; i++) if (s >= ranges[i].s && s <= ranges[i].e && e <= ranges[i].e) {
      var r = ranges[i]; return r.r ? go({ view: 'read', b: r.r.b, c: r.r.c, v: r.r.v }) : go({ view: 'doc', kind: 'vault', id: r.id });
    }
    if (s === e) { while (s > 0 && WORD.test(t[s - 1])) s--; while (e < t.length && WORD.test(t[e])) e++; }
    var w = t.slice(s, e).replace(/^[\s'’\-]+|[\s'’\-.,;:!?]+$/g, '').replace(/\s+/g, ' ');
    if (w.length < 2) { toast('Put the cursor on a word first, or select a few words'); return; }
    linkTerm(w);
  }
  ['prevW', 'linkBtn', 'nextW', 'refBtn'].forEach(function (id) { $(id).addEventListener('pointerdown', function (e) { e.preventDefault(); }); });
  $('linkBtn').onclick = linkWord;
  function moveWord(dir) {
    var ta = $('ta'); if (!ta) return; var t = ta.value, p = ta.selectionStart;
    if (dir < 0) { while (p > 0 && !WORD.test(t[p - 1])) p--; while (p > 0 && WORD.test(t[p - 1])) p--; }
    else { while (p < t.length && WORD.test(t[p])) p++; while (p < t.length && !WORD.test(t[p])) p++; }
    ta.setSelectionRange(p, p); checkPill();
  }
  $('prevW').onclick = function () { moveWord(-1); }; $('nextW').onclick = function () { moveWord(1); };
  $('refBtn').onclick = function () {
    var ta = $('ta'); if (!ta) return; var s = ta.selectionStart, pre = s > 0 && !/\s/.test(ta.value[s - 1]) ? ' ' : '';
    ta.setRangeText(pre + refStr(S.pos) + ' ', s, ta.selectionEnd, 'end'); ta.dispatchEvent(new Event('input'));
  };

  // ── Sheets: menu, backup, delete ──
  function sheet(html) { $('sheetCard').innerHTML = html; $('sheet').hidden = false; $('sheetCard').scrollTop = 0; }
  function closeSheet() { $('sheet').hidden = true; }
  $('sheet').onclick = function (e) { if (e.target === this) closeSheet(); };
  function copy(txt, msg) {
    var done = function () { closeSheet(); toast(msg || 'Copied'); };
    try { navigator.clipboard.writeText(txt).then(done, function () { showCopy(txt); }); } catch (e) { showCopy(txt); }
  }
  function showCopy(txt) {
    sheet('<h2>Copy</h2><p>Press and hold the text, choose Select all, then Copy.</p><textarea id="cTxt" readonly aria-label="Text to copy">' + esc(txt) + '</textarea><button class="sbtn" id="cClose">Done</button>');
    $('cTxt').focus(); $('cTxt').select(); $('cClose').onclick = closeSheet;
  }
  function applySize() { document.documentElement.style.setProperty('--rs', (S.size || 19) + 'px'); }
  function openMenu() {
    var hasEx = S.notes.concat(S.vault).some(function (d) { return d.ex; });
    sheet('<h2>Scripture Vault</h2><p>Your notes are saved on this phone. Copy a backup now and then and keep it somewhere safe.</p>' +
      '<div class="chapnav"><button id="mSm">A− Smaller text</button><button id="mLg">A+ Larger text</button></div>' +
      '<button class="sbtn primary" id="mCopy">Copy backup</button><button class="sbtn" id="mRestore">Restore from a backup</button>' +
      (hasEx ? '<button class="sbtn danger" id="mEx">Remove the example notes</button>' : '') +
      '<p style="font-size:14px">Bible text: King James Version (1769) and World English Bible, both public domain.</p><button class="sbtn" id="mClose">Close</button>');
    $('mClose').onclick = closeSheet;
    $('mSm').onclick = function () { S.size = Math.max(14, (S.size || 19) - 1); applySize(); save(); };
    $('mLg').onclick = function () { S.size = Math.min(30, (S.size || 19) + 1); applySize(); save(); };
    $('mCopy').onclick = function () { copy(JSON.stringify({ app: 'scripture-vault', notes: S.notes, vault: S.vault }), 'Backup copied. Paste it into an email to yourself.'); };
    $('mRestore').onclick = function () {
      sheet('<h2>Restore</h2><p>Paste a backup below. This replaces the notes on this phone now.</p><textarea id="rTxt" aria-label="Backup text"></textarea><button class="sbtn primary" id="rGo">Replace with this backup</button><button class="sbtn" id="rNo">Cancel</button>');
      $('rNo').onclick = closeSheet;
      $('rGo').onclick = function () {
        try { var s = JSON.parse($('rTxt').value); if (!s.notes || !s.vault) throw 0; S.notes = s.notes; S.vault = s.vault; buildMap(); save(); closeSheet(); stack = []; show({ view: 'read', b: S.pos.b, c: S.pos.c }); toast('Backup restored'); }
        catch (e) { toast('That text is not a Scripture Vault backup. Copy it again and paste the whole thing.'); }
      };
    };
    if ($('mEx')) $('mEx').onclick = function () { S.notes = S.notes.filter(function (d) { return !d.ex; }); S.vault = S.vault.filter(function (d) { return !d.ex; }); buildMap(); save(); closeSheet(); stack = []; show(state()); toast('Examples removed'); };
  }
  function openDocMenu() {
    var isV = cur.kind === 'vault', d = docOf(cur);
    sheet('<h2>' + esc(isV ? d.title : noteTitle(d)) + '</h2><button class="sbtn" id="dCopy">Copy text</button><button class="sbtn danger" id="dDel">Delete this ' + (isV ? 'vault page' : 'note') + '</button><button class="sbtn" id="dClose">Close</button>');
    $('dClose').onclick = closeSheet;
    $('dCopy').onclick = function () { copy((isV ? d.title : noteTitle(d)) + '\n\n' + (d.text || '')); };
    $('dDel').onclick = function () {
      sheet('<h2>Delete?</h2><p>' + (isV ? 'The name stops linking. Your notes stay as they are.' : 'This note will be gone from this phone.') + '</p><button class="sbtn danger" id="yDel">Yes, delete</button><button class="sbtn" id="nDel">Keep it</button>');
      $('nDel').onclick = closeSheet;
      $('yDel').onclick = function () {
        if (isV) S.vault = S.vault.filter(function (v) { return v.id !== d.id; }); else S.notes = S.notes.filter(function (n) { return n.id !== d.id; });
        stack = stack.filter(function (x) { return x.id !== d.id; }); buildMap(); save(); closeSheet(); back() || renderRead(); toast('Deleted');
      };
    };
  }

  // Phone back button (Android app): close a sheet, or go back. Returns true if handled.
  window.fvBack = function () { if (!$('sheet').hidden) { closeSheet(); return true; } return back(); };
  window.addEventListener('resize', function () { if (view === 'doc') paint(); });

  // Save both Bibles on the phone for offline reading (quietly, once)
  function prefetch() {
    try { if (localStorage.getItem('sv.saved') === '2') return; } catch (e) {}
    var vs = ['kjv', 'web'], k = 0;
    (function nextVer() {
      if (k >= vs.length) { try { localStorage.setItem('sv.saved', '2'); } catch (e) {} return; }
      var ver = vs[k++], b = 0;
      (function nextBook() { if (++b > 66) return nextVer(); fetch('data/' + ver + '/' + b + '.json').then(function () { setTimeout(nextBook, 60); }, function () {}); })();
    })();
  }

  S = load(); S.pos = S.pos || { b: 43, c: 3, v: 16 }; S.ver = S.ver || 'kjv'; applySize();
  buildRefs(); buildMap(); renderRead(S.pos.v);
  if ('serviceWorker' in navigator && location.protocol === 'https:' && location.hostname !== 'appassets.androidplatform.net') {
    navigator.serviceWorker.register('sw.js').then(function () { return navigator.serviceWorker.ready; }).then(function () { setTimeout(prefetch, 2500); }).catch(function () {});
  }
})();
</script>
</body>
